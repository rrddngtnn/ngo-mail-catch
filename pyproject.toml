[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ngo-mail-catch"
version = "0.2.0"
description = "Configurable public charity registry contact-domain OSINT auditor (website-absent records) and cross-track bridge dashboard."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ngo-mail-catch = "ngo_mail_catch.cli:main"

[tool.setuptools.packages.find]
where = ["packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
