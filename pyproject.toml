[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ngo-mail-catch"
version = "0.1.0"
description = "Track Beta: Public registry contact-domain extraction (website: null records) and unified Alpha/Beta correlation."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ngo-mail-catch = "ngo_mail_catch.cli:main"

[tool.setuptools.packages.find]
where = ["packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
